version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: distributed_scheduler_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_scheduler
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distributed_scheduler_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/job_scheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - PORT=8080
      - NODE_ID=node-docker-1
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distributed_scheduler_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
